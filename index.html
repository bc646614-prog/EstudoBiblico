<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Estudos Bíblicos para Pregação - Salvação, Espírito Santo, Avivamento, Arrebatamento, Dons e mais">
  <meta name="theme-color" content="#1a365d">
  <title>Estudos Bíblicos | Ebooks para Pregação</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Tela inicial -->
  <div id="home" class="screen active">
    <header class="hero">
      <div class="hero-content">
        <div class="logo">📖</div>
        <h1>Estudos Bíblicos</h1>
        <p class="subtitle">Ebooks para Pregação · Versículo a Versículo</p>
      </div>
    </header>

    <main class="books-grid" id="books-grid">
      <!-- Cards gerados via JS -->
    </main>

    <footer class="footer">
      <p>Estudos Bíblicos para Pregação Pentecostal • Versículo a Versículo</p>
    </footer>
  </div>

  <!-- Leitor de Ebook -->
  <div id="reader" class="screen">
    <header class="reader-header">
      <button class="btn-back" onclick="closeBook()" aria-label="Voltar">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </button>
      <h1 id="reader-title">Título</h1>
      <div class="reader-actions">
        <button class="btn-icon" onclick="changeFontSize(-1)" title="Diminuir fonte">A−</button>
        <button class="btn-icon" onclick="changeFontSize(1)" title="Aumentar fonte">A+</button>
        <button class="btn-icon" onclick="toggleTheme()" title="Alternar tema">◐</button>
      </div>
    </header>

    <div class="progress-bar">
      <div id="progress" class="progress-fill"></div>
    </div>

    <article id="reader-content" class="reader-content">
      <!-- Conteúdo injetado via JS -->
    </article>

    <nav class="reader-nav">
      <button id="btn-prev" class="btn-nav" onclick="prevChapter()" disabled>← Anterior</button>
      <span id="chapter-indicator">1 / 1</span>
      <button id="btn-next" class="btn-nav" onclick="nextChapter()">Próximo →</button>
    </nav>
  </div>

  <script src="js/content.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
